name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  container:
    name: Container build and persistence check
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build
      - name: Image size
        run: docker image inspect breadcrumb:local --format '{{.Size}}' | awk '{ printf "breadcrumb:local is %.0f MB\n", $1/1024/1024; if ($1 > 250*1024*1024) { print "exceeds the 250 MB target"; exit 1 } }'
      - name: History survives a rebuild (BC-004)
        run: bash scripts/persistence-check.sh
